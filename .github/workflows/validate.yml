name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: 聚合校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 安装字体工具（字形覆盖检查用）
        run: pip install fonttools

      # 检查项只在 scripts/verify.ps1 维护一份；这里不再逐条罗列
      - name: 全量校验
        shell: pwsh
        run: ./scripts/verify.ps1
