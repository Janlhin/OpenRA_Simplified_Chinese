World:
	LuaScript:
		Scripts: campaign.lua, utils.lua, nod10b.lua
	MissionData:
		Briefing: GDI 正在研发一种新型重装甲坦克。我们的间谍已找到 GDI 的研发基地。\n\n用你的小规模突击队突破该设施。确保摧毁基地内的坦克以及工厂。
		BackgroundVideo: kanepre.vqa
		LossVideo: deskill.vqa
		WinVideo: tankkill.vqa
		BriefingVideo: nod10b.vqa
	ScriptLobbyDropdown@difficulty:
		ID: difficulty
		Label: dropdown-difficulty.label
		Description: dropdown-difficulty.description
		Values:
			easy: options-difficulty.easy
			normal: options-difficulty.normal
			hard: options-difficulty.hard
		Default: normal
	-LegacyBridgeLayer:

Player:
	PlayerResources:
		DefaultCash: 0

TRAN.IN:
	Inherits: TRAN
	RejectsOrders:
	-Selectable:
	RenderSprites:
		Image: TRAN
	Buildable:
		Prerequisites: ~disabled
	Interactable:
	-RevealsShroud:

RMBO.easy:
	Inherits: RMBO
	Health:
		HP: 30000
	ChangesHealth:
		Step: 500
		Delay: 10
		StartIfBelow: 50
		DamageCooldown: 200
	RenderSprites:
		Image: RMBO

RMBO.hard:
	Inherits: RMBO
	-AutoTarget:
	-AutoTargetPriority@DEFAULT:
	-AutoTargetPriority@ATTACKANYTHING:
	-AttackMove:
	RenderSprites:
		Image: RMBO
