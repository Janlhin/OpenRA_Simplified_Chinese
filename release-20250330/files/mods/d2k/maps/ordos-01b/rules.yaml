	MissionData:
		Briefing: 香料就是财富。在帝国盆地开采香料，为奥多斯效力。如果哈克南部队试图打断香料的流通——消灭他们。\n\n出于效率考虑，必须建造香料仓以免香料损失。铺设混凝土地基，避免被恶劣环境造成不必要的损害。不这样做就是浪费。
		BriefingVideo: O_BR01_E.VQA
