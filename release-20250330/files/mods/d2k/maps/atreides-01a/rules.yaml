World:
	LuaScript:
		Scripts: campaign.lua, utils.lua, atreides01a.lua
	MissionData:
		Briefing: 在帝国盆地开采香料。建造一座香料精炼厂，并抵御散布在盆地各处的哈克南部队。你只被配属了有限的进攻兵力——要善加使用。\n\n开采的门道你只能在实践中摸索。记住建造香料仓来存放香料；没有仓储就无法继续采集。任何未铺好混凝土地基的建筑都需要立即维修，而且容易受到严酷环境的侵蚀。你最大的敌人也许是这片天地。\n\n祝你好运。
		BriefingVideo: A_BR01_E.VQA
	MapOptions:
		TechLevel: low
	ScriptLobbyDropdown@difficulty:
		ID: difficulty
		Label: dropdown-difficulty.label
		Description: dropdown-difficulty.description
		Values:
			easy: options-difficulty.easy
			normal: options-difficulty.normal
			hard: options-difficulty.hard
		Default: easy

