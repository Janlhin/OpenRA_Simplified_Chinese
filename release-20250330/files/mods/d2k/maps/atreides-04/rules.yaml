Player:
	PlayerResources:
		DefaultCash: 6000

World:
	LuaScript:
		Scripts: campaign.lua, utils.lua, atreides04.lua, atreides04-AI.lua
	MissionData:
		Briefing: 我们的侦察兵发现了隐蔽的弗雷曼基地。哈克南对弗雷曼的封锁必须被打破。\n\n南面强大的哈克南部队正在集结，准备进攻弗雷曼。已为你配属重型部队，去击穿哈克南的工事，前来援助弗雷曼。\n\n祝你好运。
		BriefingVideo: A_BR04_E.VQA
	MapOptions:
		TechLevel: low
	ScriptLobbyDropdown@difficulty:
		ID: difficulty
		Label: dropdown-difficulty.label
		Description: dropdown-difficulty.description
		Values:
			easy: options-difficulty.easy
			normal: options-difficulty.normal
			hard: options-difficulty.hard
		Default: easy

carryall.reinforce:
	Cargo:
		MaxWeight: 10

sietch:
	Exit:
		ExitCell: 0,2
	Production:
		Produces: Infantry

nsfremen:
	Buildable:
		Prerequisites: ~sietch
	AutoTarget:
		InitialStanceAI: AttackAnything

concreteb:
	Buildable:
		Prerequisites: ~disabled

medium_gun_turret:
	Buildable:
		Prerequisites: ~disabled

outpost:
	Buildable:
		Prerequisites: barracks

quad:
	Buildable:
		Prerequisites: upgrade.light

trooper:
	Buildable:
		Prerequisites: upgrade.barracks

engineer:
	Buildable:
		Prerequisites: upgrade.barracks

repair_pad:
	Buildable:
		Prerequisites: heavy_factory, upgrade.heavy

mcv:
	Buildable:
		Prerequisites: repair_pad, upgrade.heavy

upgrade.conyard:
	Buildable:
		Prerequisites: ~disabled

# HACK: AI units can't attack the sietch if it was on a real rock
tile475:
	AlwaysVisible:
	Immobile:
		OccupiesSpace: false
	RenderSprites:
		Palette: d2k
	WithIdleOverlay@2:
		Sequence: idle2
	WithIdleOverlay@3:
		Sequence: idle3
	WithIdleOverlay@4:
		Sequence: idle4
	WithSpriteBody:
	BodyOrientation:
		QuantizedFacings: 1
	Interactable:

# Placed after the sietch is destroyed so that the cliff is still unpassable
invisibleBlocker:
	AlwaysVisible:
	Building:
		Footprint: xx xx
		Dimensions: 2,2
