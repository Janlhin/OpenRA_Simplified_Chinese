		Scripts: campaign.lua, utils.lua, atreides03b.lua, atreides03b-AI.lua
	MissionData:
		Briefing: 尽快把阿特雷德斯部队扩充到作战实力。防范突袭，并确保香料产量。\n\n奥多斯部队装甲较薄但数量众多。为对付他们，你被授权生产四轮导弹车——它的反车辆能力比三轮摩托更强。升级你的轻型工厂以生产这些单位。\n\n以压倒性的力量回应任何挑衅。\n\n祝你好运。
		BriefingVideo: A_BR03_E.VQA
