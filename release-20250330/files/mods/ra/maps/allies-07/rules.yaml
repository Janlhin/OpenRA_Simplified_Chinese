World:
	LuaScript:
		Scripts: campaign.lua, utils.lua, allies07.lua, allies07-AI.lua
	MissionData:
		Briefing: 陆指 16 司令部。\n\n绝密。\n\n致：战地指挥官 A9\n\n截获的苏联通讯表明，他们的铁幕研究因间谍活动而受挫。干得好，指挥官！\n\n通讯信号可追溯至博恩霍尔姆的一座苏联秘密基地。调查其与铁幕研究之间可能存在的联系。占领雷达中心，摧毁其潜艇生产能力。\n\n确认代码 1138。\n\n通讯结束。
		StartVideo: shorbom1.vqa
		WinVideo: shorbom2.vqa
		LossVideo: shipsink.vqa
	ScriptLobbyDropdown@difficulty:
		ID: difficulty
		Label: dropdown-difficulty.label
		Description: dropdown-difficulty.description
		Values:
			easy: options-difficulty.easy
			normal: options-difficulty.normal
			hard: options-difficulty.hard
		Default: normal

