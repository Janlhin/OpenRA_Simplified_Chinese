World:
	LuaScript:
		Scripts: campaign.lua, utils.lua, soviet-soldier-volkov-n-chitzkoi.lua, soviet-soldier-volkov-n-chitzkoi-AI.lua
	MissionData:
		Briefing: 盟军从我们这里偷走了一种新的装甲镀层。凭借它，他们能让建筑几乎刀枪不入。他们的加工厂必须被摧毁。\n\n为了这次关键任务，我们允许你调用士兵沃尔科夫。用他和他的机械犬破坏盟军控制中心，为我们东南方向的部队打开通往合金设施的道路。\n\n当沃尔科夫摧毁控制中心、我们的部队摧毁合金设施时，任务成功。
		WinVideo: grvestne.vqa
		LossVideo: sovcemet.vqa
	ScriptLobbyDropdown@difficulty:
		ID: difficulty
		Label: dropdown-difficulty.label
		Description: dropdown-difficulty.description
		Values:
			easy: options-difficulty.easy
			normal: options-difficulty.normal
			hard: options-difficulty.hard
		Default: normal

