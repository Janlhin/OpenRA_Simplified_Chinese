		Briefing: 我们部队中的一支激进派系窃取了一件生物武器，威胁要用在盟军阵地上。该武器极不稳定，一旦释放可能毁掉我们所有人。\n\n设施必须摧毁，但首先要让武器失效。摧毁岛上的防御，然后用沃尔科夫护送我们的科学家抵达生物研究中心。如果在武器失效之前这两者中任何一人被杀，任务即告失败。\n\n科学家完成任务后，摧毁基地。

