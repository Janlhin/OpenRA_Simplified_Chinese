World:
	LuaScript:
		Scripts: campaign.lua, utils.lua, allies03a.lua
	MissionData:
		Briefing: 陆指 16 司令部。\n\n绝密。\n\n致：战地指挥官 A9\n\n情报侦察显示你所在区域有苏军大规模调动。附近的桥梁是苏军推进的关键。尽快摧毁所有桥梁。谭雅将协助你。务必让她存活。\n\n确认代码 1612。\n\n通讯结束。
		StartVideo: brdgtilt.vqa
		WinVideo: toofar.vqa
		LossVideo: sovtstar.vqa
	ScriptLobbyDropdown@difficulty:
		ID: difficulty
		Label: dropdown-difficulty.label
		Description: dropdown-difficulty.description
		Values:
			easy: options-difficulty.easy
			normal: options-difficulty.normal
			hard: options-difficulty.hard
		Default: normal

