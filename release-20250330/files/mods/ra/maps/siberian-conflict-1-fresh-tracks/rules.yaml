		Briefing: 苏联在西伯利亚的活动日益频繁。一大批核材料正经过此区域，我们必须拦住它。摧毁所有苏联车队卡车，阻止苏联继续他们的核试验。\n\n小心车队卡车的货物——核材料极不稳定。\n\n当每支车队的卡车全部被摧毁时，任务完成。
	ScriptLobbyDropdown@difficulty:
