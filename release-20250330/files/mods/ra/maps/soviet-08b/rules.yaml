World:
	LuaScript:
		Scripts: campaign.lua, utils.lua, soviet08b.lua, soviet08b-AI.lua
	MissionData:
		Briefing: 我们侦测到厄尔巴岛上有盟军活动。盟军打算以该岛为跳板对苏联帝国发动进攻。\n\n你必须确保该岛不再受盟军控制。摧毁岛上及周边的所有盟军单位。\n\n当地居民也一直在协助盟军。帮助敌人只有一种惩罚——死刑。
		BriefingVideo: soviet8.vqa
		StartVideo: slntsrvc.vqa
		WinVideo: bombrun.vqa
		LossVideo: allymorf.vqa
	ScriptLobbyDropdown@difficulty:
		ID: difficulty
		Label: dropdown-difficulty.label
		Description: dropdown-difficulty.description
		Values:
			easy: options-difficulty.easy
			normal: options-difficulty.normal
			hard: options-difficulty.hard
		Default: normal

