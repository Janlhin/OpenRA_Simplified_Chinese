World:
	LuaScript:
		Scripts: campaign.lua, utils.lua, personal-war.lua
	MissionData:
		WinVideo: toofar.vqa
		LossVideo: bmap.vqa
		Briefing: 战火正迅速逼近雅典，斯塔夫罗斯坚持要回希腊的家乡查看损毁情况。\n\n你必须护送斯塔夫罗斯穿过城镇，抵达附近的一座友军前哨站。到达后，把他安全撤出。\n\n万一出了什么状况，不惜一切手段把斯塔夫罗斯送到安全处。他必须活着。
	ScriptLobbyDropdown@difficulty:
		ID: difficulty
		Label: dropdown-difficulty.label
		Description: dropdown-difficulty.description
		Values:
			normal: options-difficulty.normal
			hard: options-difficulty.hard
		Default: normal

