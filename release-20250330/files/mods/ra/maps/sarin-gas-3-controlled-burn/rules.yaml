	MissionData:
		WinVideo: apcescpe.vqa
		LossVideo: tesla.vqa
		Briefing: 我们已渗透进入苏联的沙林设施。但主入口被一道磁暴线圈之墙守住。在打掉它们之前，我们无法投入大部队。\n\n渗透东面的电网，或摧毁发电厂。完成之后增援就会抵达。\n\n摧毁苏联营地，但所有沙林加工建筑必须完整占领——我们不能冒化学泄漏的风险。
