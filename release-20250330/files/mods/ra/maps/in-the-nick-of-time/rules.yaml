World:
	LuaScript:
		Scripts: campaign.lua, utils.lua, in-the-nick-of-time.lua
	MissionData:
		WinVideo: cronfail.vqa
		LossVideo: sfrozen.vqa
		Briefing: 局势危急！苏联已占领北方一座小型研究基地。冲突中，一台超时空传送仪严重受损。我们担心它会爆炸。\n\n基地里有一批在占领时被俘的科学家。必须在超时空传送仪爆炸之前把他们救出来。杀回基地，把他们带出来。\n\n小心——进出基地只有一条路，一座孤桥。为确保撤离，必须守住它。

