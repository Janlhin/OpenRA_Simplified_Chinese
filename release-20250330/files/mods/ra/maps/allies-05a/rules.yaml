World:
	LuaScript:
		Scripts: campaign.lua, utils.lua, allies05a.lua, allies05a-AI.lua
	MissionData:
		Briefing: 营救谭雅。\n\n伪装之后，你的间谍可以越过任何敌方单位而不被发现，狗除外。把他派进附近苏联基地的武器工厂，在那里他可以劫持一辆卡车并放出谭雅。\n\n在谭雅的协助下，清掉岛上的防空火力，让支努干能够飞抵并把她接走。\n\n然后摧毁所有残余的苏联建筑与单位。
		BriefingVideo: ally5.vqa
		StartVideo: tanya1.vqa
		WinVideo: tanya2.vqa
		LossVideo: grvestne.vqa
	MapOptions:
		TechLevel: medium
	ScriptLobbyDropdown@difficulty:
		ID: difficulty
		Label: dropdown-difficulty.label
		Description: dropdown-difficulty.description
		Values:
			easy: options-difficulty.easy
			normal: options-difficulty.normal
			hard: options-difficulty.hard
			tough: options-difficulty.tough
		Default: normal

