World:
	LuaScript:
		Scripts: campaign.lua, utils.lua, production-disruption.lua
	MissionData:
		WinVideo: battle.vqa
		LossVideo: slntsrvc.vqa
		Briefing: 苏联正在建造一型能够发射海对地导弹的新型潜艇。它会带来怎样的灾难，不用我们多说。\n\n带一支小队渗透他们的电网。电网一断，增援随后就到。然后北上摧毁潜艇船坞，阻止这类潜艇的继续建造。\n\n如果有潜艇已经建成，绝不能让它逃走！
	StartGameNotification:
		Notification: MissionTimerInitialised
	ScriptLobbyDropdown@difficulty:
		ID: difficulty
		Label: dropdown-difficulty.label
		Description: dropdown-difficulty.description
		Values:
			easy: options-difficulty.easy
			normal: options-difficulty.normal
			hard: options-difficulty.hard
		Default: normal

